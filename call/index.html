<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Call in Progress</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 14px);
      padding-left: 28px;
      padding-right: 22px;
      padding-bottom: 0;
      height: calc(max(env(safe-area-inset-top), 14px) + 26px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .sb-time {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
    }

    /* Dynamic island */
    .dynamic-island {
      position: absolute;
      top: max(env(safe-area-inset-top), 14px);
      left: 50%;
      transform: translate(-50%, 0);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 999px;
      z-index: 20;
    }

    .sb-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Signal bars */
    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .signal span {
      display: block;
      width: 3px;
      background: #fff;
      border-radius: 1px;
    }
    .signal span:nth-child(1) { height: 4px; }
    .signal span:nth-child(2) { height: 6px; }
    .signal span:nth-child(3) { height: 9px; }
    .signal span:nth-child(4) { height: 12px; }

    .sb-5g {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* WiFi */
    .wifi svg {
      display: block;
      width: 16px;
      height: 12px;
      fill: #fff;
    }

    /* Battery */
    .battery {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .battery-body {
      width: 25px;
      height: 12px;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      padding: 2px;
      position: relative;
    }
    .battery-fill {
      height: 100%;
      width: 72%;
      background: #fff;
      border-radius: 1.5px;
    }
    .battery-tip {
      width: 2px;
      height: 5px;
      background: rgba(255,255,255,0.35);
      border-radius: 0 1px 1px 0;
    }

    /* ── Main content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: max(env(safe-area-inset-bottom), 28px);
      padding-top: 20px;
    }

    /* ── Caller block ── */
    .caller {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      padding: 0 24px;
    }

    .status-label {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.01em;
      margin-bottom: 16px;
      transition: color 0.4s;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      margin-bottom: 18px;
      transition: opacity 0.4s;
    }

    .caller-name {
      font-size: 38px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .caller-sub {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      font-weight: 400;
      margin-top: 2px;
    }

    .duration {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      margin-top: 10px;
      letter-spacing: 0.01em;
      min-height: 22px;
    }

    /* ── Button grid ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 8px;
      width: 100%;
      max-width: 320px;
      padding: 0 20px;
      transition: opacity 0.4s;
    }

    .call-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      background: none;
      border: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .call-btn .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .call-btn svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }

    .call-btn .btn-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    /* ── End button ── */
    .end-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .end-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ff3b30;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.35s, transform 0.12s;
      box-shadow: 0 4px 20px rgba(255,59,48,0.4);
    }
    .end-btn:active { transform: scale(0.91); }

    .end-btn svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .end-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* ── Ended state ── */
    body.ended .avatar { opacity: 0.3; }
    body.ended .btn-grid { opacity: 0; pointer-events: none; }
    body.ended .end-btn { background: #34c759; box-shadow: 0 4px 20px rgba(52,199,89,0.4); }
  </style>
</head>
<body>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="sb-time" id="sbTime"></span>
    <div class="dynamic-island"></div>
    <div class="sb-right">
      <div class="signal">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="sb-5g">5G</span>
      <div class="wifi">
        <svg viewBox="0 0 24 17" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 13.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0-4.5a8.5 8.5 0 0 1 6.1 2.57l-1.42 1.42A6.5 6.5 0 0 0 12 11a6.5 6.5 0 0 0-4.68 1.99L5.9 11.57A8.5 8.5 0 0 1 12 9zm0-4.5c3.87 0 7.36 1.57 9.9 4.1L20.48 10A11.5 11.5 0 0 0 12 6.5c-3.18 0-6.06 1.29-8.15 3.37L2.44 8.46A13.5 13.5 0 0 1 12 4.5zm0-4.5C17.52 0 22.5 2.24 26.07 5.86L24.65 7.3A17.5 17.5 0 0 0 12 1.5a17.5 17.5 0 0 0-12.4 5.13L-1.83 5.19A19.5 19.5 0 0 1 12 0z"/>
        </svg>
      </div>
      <div class="battery">
        <div class="battery-body"><div class="battery-fill"></div></div>
        <div class="battery-tip"></div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <div class="caller">
      <div class="status-label" id="statusLabel">mobile</div>
      <div class="avatar">?</div>
      <div class="caller-name">Unknown</div>
      <div class="caller-sub">caller id withheld</div>
      <div class="duration" id="duration"></div>
    </div>

    <div class="btn-grid">
      <!-- Mute -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 9a6 6 0 0 0 12 0h-2a4 4 0 0 1-8 0H6zm5 6.93V21H9v2h6v-2h-2v-4.07A7 7 0 0 0 19 10h-2a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93z"/></svg>
        </div>
        <span class="btn-label">mute</span>
      </button>
      <!-- Keypad -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="4" r="1.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="18" cy="4" r="1.5"/><circle cx="6" cy="9.5" r="1.5"/><circle cx="12" cy="9.5" r="1.5"/><circle cx="18" cy="9.5" r="1.5"/><circle cx="6" cy="15" r="1.5"/><circle cx="12" cy="15" r="1.5"/><circle cx="18" cy="15" r="1.5"/><circle cx="12" cy="20.5" r="1.5"/></svg>
        </div>
        <span class="btn-label">keypad</span>
      </button>
      <!-- Speaker -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </div>
        <span class="btn-label">speaker</span>
      </button>
      <!-- Add call -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M19 3h-2v3h-3v2h3v3h2V8h3V6h-3V3zM6.5 4C4 4 2 6 2 8.5c0 5.79 7.5 12.5 12 12.5s12-6.71 12-12.5C20 6 18 4 15.5 4c-.94 0-1.95.4-2.79 1.03l-.71.53-.71-.53C10.45 4.4 9.44 4 8.5 4H6.5zm-2.5 4.5C4 7.12 5.12 6 6.5 6h2c.5 0 1.09.22 1.68.63l1.82 1.36 1.82-1.36C14.41 6.22 15 6 15.5 6H17.5C18.88 6 20 7.12 20 8.5c0 4.5-6.5 10.5-10 10.5S0 13 0 8.5z"/></svg>
        </div>
        <span class="btn-label">add call</span>
      </button>
      <!-- FaceTime -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </div>
        <span class="btn-label">FaceTime</span>
      </button>
      <!-- Contacts -->
      <button class="call-btn" tabindex="-1">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span class="btn-label">contacts</span>
      </button>
    </div>

    <div class="end-row">
      <button class="end-btn" id="endBtn" aria-label="End call">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.69.28-.27 0-.52-.11-.7-.29L.29 13.08a.99.99 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .27-.11.52-.29.7l-2.5 2.48c-.18.18-.43.29-.7.29-.26 0-.51-.1-.69-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
      <span class="end-label" id="endLabel">end</span>
    </div>

  </div>

<script>
  const BASE_SECONDS = Math.round(11 * 365.25 * 24 * 3600);
  const durationEl  = document.getElementById('duration');
  const statusLabel = document.getElementById('statusLabel');
  const endBtn      = document.getElementById('endBtn');
  const endLabel    = document.getElementById('endLabel');
  const sbTime      = document.getElementById('sbTime');
  const body        = document.body;

  let elapsed = 0, timer = null, clockTimer = null, ended = false;

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDuration(totalSec) {
    const extra = totalSec - BASE_SECONDS;
    const days  = Math.floor(extra / 86400);
    const r     = extra % 86400;
    return `11 years  ${days}d ${pad(Math.floor(r/3600))}:${pad(Math.floor((r%3600)/60))}:${pad(r%60)}`;
  }

  function updateClock() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes();
    sbTime.textContent = `${h}:${pad(m)}`;
  }

  function tick() {
    elapsed++;
    durationEl.textContent = formatDuration(BASE_SECONDS + elapsed);
  }

  function startCall() {
    ended = false; elapsed = 0;
    body.classList.remove('ended');
    statusLabel.textContent = 'mobile';
    endLabel.textContent = 'end';
    durationEl.textContent = formatDuration(BASE_SECONDS);
    timer = setInterval(tick, 1000);
  }

  function endCall() {
    ended = true;
    clearInterval(timer); timer = null;
    body.classList.add('ended');
    statusLabel.textContent = 'call ended';
    endLabel.textContent = 'call back';
    durationEl.textContent = 'Duration: 11 years';
  }

  endBtn.addEventListener('click', e => { e.stopPropagation(); if (!ended) endCall(); });
  body.addEventListener('click', () => { if (ended) startCall(); });

  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  updateClock();
  clockTimer = setInterval(updateClock, 10000);
  startCall();
</script>
</body>
</html>
