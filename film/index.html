<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11 Years</title>
  <meta name="robots" content="noindex" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #050508;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Subtle radial glow */
    body::before {
      content: '';
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(80,80,120,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      gap: 72px;
    }

    /* ── Text ── */
    .copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      max-width: 480px;
    }

    h1 {
      font-size: clamp(44px, 9vw, 80px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: #fff;
    }

    h1 em {
      font-style: normal;
      color: rgba(255,255,255,0.22);
    }

    .sub {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255,255,255,0.38);
      font-weight: 400;
      max-width: 320px;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 4px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 13px 24px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity .15s, transform .15s;
    }
    .open-btn:hover { opacity: 0.88; transform: scale(0.98); }
    .open-btn svg { width: 16px; height: 16px; fill: #000; }

    /* ── Phone mockup ── */
    .phone-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .phone {
      position: relative;
      width: 260px;
      height: 540px;
      background: #0a0a0a;
      border-radius: 48px;
      border: 6px solid #1a1a1a;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 48px 120px rgba(0,0,0,0.8),
        0 0 80px rgba(60,60,100,0.1);
      overflow: hidden;
    }

    /* Dynamic island */
    .phone::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 30px;
      background: #000;
      border-radius: 999px;
      z-index: 10;
    }

    /* Side buttons */
    .btn { position: absolute; background: #1a1a1a; border-radius: 3px; }
    .btn.vol-up   { left: -8px; top: 116px; width: 3px; height: 32px; }
    .btn.vol-dn   { left: -8px; top: 158px; width: 3px; height: 32px; }
    .btn.silent   { left: -8px; top: 86px;  width: 3px; height: 22px; }
    .btn.power    { right: -8px; top: 136px; width: 3px; height: 60px; }

    /* Lens glare */
    .phone-glare {
      position: absolute; inset: 0;
      background: linear-gradient(130deg, rgba(255,255,255,0.03) 0%, transparent 45%);
      border-radius: 44px;
      pointer-events: none;
      z-index: 20;
    }

    .phone iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    /* Tap-to-interact */
    .tap-layer {
      position: absolute;
      inset: 0;
      border-radius: 44px;
      z-index: 15;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 28px;
    }
    .tap-hint {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .phone-wrap.live .tap-layer { display: none; }
    .phone-wrap.live .phone iframe { pointer-events: auto; }

    /* ── Responsive ── */
    @media (min-width: 800px) {
      .page {
        flex-direction: row;
        justify-content: center;
        gap: 100px;
        padding: 60px 60px;
      }
      .copy { align-items: flex-start; text-align: left; }
      .sub  { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="copy">
      <h1>A call<br>that never<br><em>ended.</em></h1>
      <p class="sub">A prop built for a short film. The timer has been running for eleven years. Open it on your phone.</p>
      <a class="open-btn" href="../call/" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        Open call screen
      </a>
    </div>

    <div class="phone-wrap" id="wrap">
      <div class="phone">
        <div class="btn silent"></div>
        <div class="btn vol-up"></div>
        <div class="btn vol-dn"></div>
        <div class="btn power"></div>
        <iframe src="../call/" title="Call screen" loading="lazy" scrolling="no"></iframe>
        <div class="phone-glare"></div>
      </div>
      <div class="tap-layer" id="tapLayer">
        <span class="tap-hint">tap to interact</span>
      </div>
    </div>

  </div>

  <script>
    const wrap = document.getElementById('wrap');
    document.getElementById('tapLayer').addEventListener('click', () => wrap.classList.add('live'));
    document.addEventListener('click', e => { if (!wrap.contains(e.target)) wrap.classList.remove('live'); });
  </script>
</body>
</html>
